<nz-sider class="sidebar"
          nzCollapsible
          nzWidth="256px"
          nzBreakpoint="md"
          [(nzCollapsed)]="isCollapsed"
          [nzTrigger]="null"
          [ngClass]="{'mobile-open': isMobileMenuOpen}">

  <div class="sidebar-content">
    <!-- Mobile Header Section (similar to navbar) -->
    <div class="mobile-header" *ngIf="isMobileMenuOpen">
      <div class="mobile-logo">
        <div class="logo-container">
          <div class="logo-square">
            <span class="logo-text">VNPT</span>
          </div>
          <span class="logo-title">Developers</span>
        </div>
      </div>
    </div>

    <!-- Mobile Search Section -->
    <div class="mobile-search-section" *ngIf="isMobileMenuOpen">
      <div class="search-container">
        <nz-input-group [nzSuffix]="searchSuffix" class="search-input">
          <nz-icon class="search-icon" nzType="search" nzTheme="outline" />
          <input nz-input
                 [(ngModel)]="searchValue"
                 placeholder="Tìm kiếm tài liệu"
                 (keyup.enter)="onSearch()" />
        </nz-input-group>
        <ng-template #searchSuffix>
          <span class="search-shortcut">Ctrl+K</span>
        </ng-template>
      </div>
    </div>

    <!-- Mobile Language & GitHub Section -->
    <div class="mobile-actions-section" *ngIf="isMobileMenuOpen">
      <div class="language-dropdown">
        <button nz-button class="language-button">
          <span nz-icon nzType="global" nzTheme="outline"></span>
          <span class="language-text">Tiếng Việt</span>
          <span nz-icon nzType="down" nzTheme="outline"></span>
        </button>
        <ul class="language-menu">
          <li class="language-item" *ngFor="let lang of languageOptions"
              (click)="onLanguageChange(lang.key)">
            {{ lang.label }}
          </li>
        </ul>
      </div>

      <a href="https://github.com" target="_blank" class="github-link">
        <span nz-icon nzType="github" nzTheme="outline"></span>
      </a>
    </div>

    <!-- Desktop Logo Section -->
    <div class="sidebar-logo" *ngIf="!isMobileMenuOpen">
      <div class="logo-container">
        <div class="logo-square">
          <span class="logo-text">VNPT</span>
        </div>
        <span class="logo-title">Developers</span>
      </div>
    </div>

    <div class="sidebar-menu">
      <div class="menu-section" *ngFor="let section of sidebarMenuItems; let i = index">
        <!-- Section Header -->
        <div class="section-header" (click)="toggleSection(i)">
          <span class="section-title">{{ section.title }}</span>
          <span nz-icon [nzType]="section.isOpen ? 'up' : 'down'" class="section-icon">
          </span>
        </div>

        <!-- Section Children -->
        <div class="section-children" [class.expanded]="section.isOpen">
          <div class="menu-item" *ngFor="let item of section.children" [class.active]="item.isActive">
            <a [routerLink]="item.routerLink"
               routerLinkActive="active-link"
               class="menu-link"
               (click)="onMenuClick(item)">
              {{ item.label }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

</nz-sider>

<!-- Mobile Menu Overlay -->
<div class="mobile-sidebar-overlay"
     [ngClass]="{'active': isMobileMenuOpen}"
     (click)="closeMobileMenu()">
</div>
